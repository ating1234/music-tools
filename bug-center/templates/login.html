<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 | 集中式 Bug 回報中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0b0c10;
            --color-surface: rgba(21, 23, 30, 0.7);
            --color-primary: #ff4d3d;
            --color-primary-glow: rgba(255, 77, 61, 0.45);
            --color-text: #e2e8f0;
            --color-text-muted: #64748b;
            --color-border: rgba(255, 255, 255, 0.07);
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 77, 61, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 184, 77, 0.03) 0%, transparent 50%);
        }

        /* 背景微光裝飾 */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--color-primary);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .glow-1 { top: 20%; left: 30%; }
        .glow-2 { bottom: 20%; right: 30%; }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255, 77, 61, 0.1);
            border: 1.5px solid var(--color-primary);
            border-radius: 12px;
            color: var(--color-primary);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--color-primary-glow);
            font-family: var(--font-mono);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.82rem;
            color: var(--color-text-muted);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            font-family: var(--font-mono);
        }

        input[type="password"]:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(255, 77, 61, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 77, 61, 0.25);
        }

        button:hover {
            background: #ff6456;
            box-shadow: 0 4px 20px var(--color-primary-glow);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>

    <div class="login-container">
        <div class="header">
            <div class="logo">⚡</div>
            <h1>私有回報中心</h1>
            <p class="subtitle">PRIVATE BUG CENTER</p>
        </div>

        <form action="/login" method="POST">
            {% if error %}
            <div class="error-message">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="password">管理員密碼</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required autofocus>
                </div>
            </div>

            <button type="submit">驗證並進入後台</button>
        </form>

        <div class="footer-text">SECURED BY COOKIE SESSION</div>
    </div>
</body>
</html>
